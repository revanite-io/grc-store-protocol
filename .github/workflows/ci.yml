name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Clone the repository
    strategy:
      matrix:
        # The declared go.mod floor AND the newest release — a zero-dependency
        # contract module must build on the minimum it advertises.
        go: ['1.26', '1.27']
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { echo 'gofmt:'; gofmt -l .; exit 1; }
      - name: tidy + enforce zero dependencies
        # This module is dependency-free by design (contract, not client). go mod
        # tidy must be a no-op; if it writes go.mod or creates a go.sum, a
        # dependency snuck in. Uses git status (not `git diff <path>`, which
        # fatals on a not-yet-existing go.sum).
        run: |
          go mod tidy
          changed="$(git status --porcelain go.mod go.sum)"
          if [ -n "$changed" ]; then
            echo "::error::go.mod/go.sum changed by 'go mod tidy' — this module must stay dependency-free:"
            echo "$changed"
            exit 1
          fi
      - run: go test ./... -count=1
