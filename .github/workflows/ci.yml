name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Clone the repository
    strategy:
      matrix:
        # The declared go.mod floor AND a recent toolchain — a zero-dependency
        # contract module must build on the minimum it advertises.
        go: ['1.22', '1.26']
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { echo 'gofmt:'; gofmt -l .; exit 1; }
      - name: tidy + enforce zero dependencies
        # This module is dependency-free by design (contract, not client). go mod
        # tidy must be a no-op; if it writes go.mod or creates a go.sum, a
        # dependency snuck in. Uses git status (not `git diff <path>`, which
        # fatals on a not-yet-existing go.sum).
        run: |
          go mod tidy
          changed="$(git status --porcelain go.mod go.sum)"
          if [ -n "$changed" ]; then
            echo "::error::go.mod/go.sum changed by 'go mod tidy' — this module must stay dependency-free:"
            echo "$changed"
            exit 1
          fi
      - run: go test ./... -count=1
